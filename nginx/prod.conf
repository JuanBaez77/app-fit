# nginx del contenedor web. El HTTPS lo termina el nginx del host (docs/deploy.md).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # /api/health -> api:8000/health
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 2m;
    }

    # Los archivos con hash en el nombre no cambian nunca
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifest se revisan siempre: así llega cada versión nueva
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo cae en index.html
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html =404;
    }
}
