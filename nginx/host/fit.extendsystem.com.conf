# app-fit (fit.extendsystem.com) detrás del nginx del host, con Cloudflare adelante.
#
# Archivo aparte, con su propio server_name: no toca los otros sitios. Escucha solo en IPv4,
# igual que el resto. La app corre en docker compose (/root/app-fit) y escucha en
# 127.0.0.1:8020. Copia de nginx/host/fit.extendsystem.com.conf del repo; guía en docs/deploy.md.

# HTTP: solo para renovar el certificado; todo lo demás va a HTTPS.
server {
    listen 80;
    server_name fit.extendsystem.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fit.extendsystem.com;

    ssl_certificate /etc/letsencrypt/live/fit.extendsystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.extendsystem.com/privkey.pem;
    # Los mismos parámetros TLS que los demás sitios: comparten el socket del 443.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # IP real del cliente detrás de Cloudflare (solo si la conexión viene de Cloudflare).
    include /etc/nginx/snippets/app-fit-cloudflare-realip.conf;

    server_tokens off;
    # Una sincronización con muchas series juntas
    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Se reemplaza, no se agrega: lo que mande el cliente no cuenta
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El análisis del brain puede tardar (Cloudflare con proxy corta a los 100 s)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
